<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>ssh</title>

<style>
    html {
      background: rgb(0, 0, 0);
    }
    h1 {
      font: 30px/1.5 sans-serif;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.17.0/css/xterm.css" />
	<script src="https://cdn.jsdelivr.net/npm/xterm@4.17.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.5.1/lib/xterm-addon-web-links.min.js"></script> 
  <script>
  
    window.onload=function() {
      // Test size: 25x80
      var termRowHeight=0.0+1.00*document.getElementById("dummy-screen").offsetHeight/25;
      var termColWidth=0.0+(1.02*document.getElementById("dummy-screen-rows").offsetWidth/80);
      document.getElementById("dummy-screen").setAttribute("style","display: none");
      

      var protocol=(window.location.protocol.indexOf("https")===0)? "wss":"ws";
      var ws_url=protocol+"://"+window.location.host + window.location.pathname + "{{ws_url_path}}";

      function calculate_size(element) {
        var rows=Math.max(2,Math.floor(element.innerHeight/termRowHeight)-1);
        var cols=Math.max(3,Math.floor(element.innerWidth/termColWidth)-1);
        console.log("resize:",termRowHeight,termColWidth,element.innerHeight,
          element.innerWidth,rows,cols);
        return {rows: rows,cols: cols};
      }

      size=calculate_size(window);

      var term = new Terminal({cols: size.cols, rows: size.rows});

      term.loadAddon(new FitAddon.FitAddon());
      term.loadAddon(new WebLinksAddon.WebLinksAddon());

      term.attachCustomKeyEventHandler(function (e) {
        // Ctrl + Shift + C
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 3)) {
          var copySucceeded = document.execCommand('copy');
          console.log('copy succeeded', copySucceeded);
          return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode == 86) {
          // var pasteSucceeded = document.execCommand('paste');
          // console.log('paste succeeded', pasteSucceeded);
          navigator.clipboard.readText().then(text => {
            console.log(text)
            term.paste(text);
          })
          return false;
        }
      });

      term.open(document.body);
      var disposable = null;
      function make_reconneting_terminal(size,ws_url) {
        var ws = new WebSocket(ws_url);

        ws.onopen=function(event) {
          ws.send(JSON.stringify(["set_size",size.rows,size.cols,
            window.innerHeight,window.innerWidth]));
          disposable = term.onData((data) => {
            ws.send(JSON.stringify(['stdin',data]));
          });

          term.onTitleChange((title) => {
            document.title=title;
          });

          ws.onmessage=function(event) {
            json_msg=JSON.parse(event.data);
            switch(json_msg[0]) {
              case "stdout":
                term.write(json_msg[1]);
                break;
              case "disconnect":
                term.write("\r\n\r\n[Session was closed(maybe due inactivity)]\r\n");
                break;
            }
          };
        };
        ws.onclose = function(event) {
          console.log('socket close');
          if(disposable) {
            disposable.dispose()
          }
          setTimeout(make_reconneting_terminal(size,ws_url),500);
        };
        return {socket: ws,term: term};
      }

      var terminal = make_reconneting_terminal(size, ws_url);
      window.onresize=function() {
        var geom=calculate_size(window);
        terminal.term.resize(geom.cols,geom.rows);
        terminal.socket.send(JSON.stringify(["set_size",geom.rows,geom.cols,
          window.innerHeight,window.innerWidth]));
      };
    };
  </script>
</head>

<body>
