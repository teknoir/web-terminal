name: Build and Push

on:
  push:
    branches: ["**"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH="${BRANCH//\//-}"
          TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
          TAGS="${IMAGE}:${SAFE_BRANCH}-${TIMESTAMP}"
          TAGS="${TAGS},${IMAGE}:${SAFE_BRANCH}"
          TAGS="${TAGS},${IMAGE}:sha-${GITHUB_SHA::8}"
          # ':latest' is frozen at digest sha256:6316438d667b82d5eccedf643eefa87d265eaa7f4d8b515d1c45bc37bc436c43
          # because production legacy terminals pull it; move it only deliberately.
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
