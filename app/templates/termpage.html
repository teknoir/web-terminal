<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>ssh</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<style>
    @font-face {
        font-family: 'MesloLGS NF';
        src: url('https://cdn.jsdelivr.net/gh/romkatv/powerlevel10k-media@master/MesloLGS%20NF%20Regular.ttf') format('truetype');
    }

    h1 {
      font: 30px/1.5 sans-serif;
    }
    html,
    body {
        background: rgb(0, 0, 0);
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent; /* make scrollbar transparent */
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.17.0/css/xterm.css" />
	<script src="https://cdn.jsdelivr.net/npm/xterm@4.17.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.5.0/lib/xterm-addon-fit.js"></script> 
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.5.1/lib/xterm-addon-web-links.min.js"></script> 
  <script>
  
    window.onload = function() {
      var protocol = (window.location.protocol.indexOf("https") === 0) ? "wss" : "ws";
      var path = window.location.pathname;
      if (!path.endsWith('/')) {
        path += '/';
      }
      var ws_endpoint = "{{ws_url_path}}";
      if (ws_endpoint.startsWith('/')) {
        ws_endpoint = ws_endpoint.substring(1);
      }
      var ws_url = protocol + "://" + window.location.host + path + ws_endpoint;

      var term = new Terminal({
        fontFamily: '"MesloLGS NF", "DejaVu Sans Mono", "Liberation Mono", monospace',
        fontSize: 14,
      });
      var fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.loadAddon(new WebLinksAddon.WebLinksAddon());

      term.open(document.body);
      fitAddon.fit();

      var ws;

      term.onResize((size) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(['set_size', size.rows, size.cols]));
        }
      });

      term.attachCustomKeyEventHandler(function (e) {
        // Ctrl + Shift + C
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 3)) {
          document.execCommand('copy');
          return false;
        }
      });

      var data_disposable = null;
      var title_disposable = null;

      // Reconnect policy (kept pure so it can be checked by hand in a console):
      //   info = {opened: bool, lived_ms: ms between open and close, ended: server ended the
      //           session (disconnect message or normal close), failures: consecutive failures so far}
      // returns {action: "retry", delay_ms, failures} or {action: "end"}.
      var MAX_FAILURES = 3, MIN_LIVE_MS = 2000;
      function reconnect_decision(info) {
        if (info.opened && (info.ended || info.lived_ms >= MIN_LIVE_MS)) return {action: "end"};
        var failures = info.failures + 1; // closed without opening, or within 2 s of opening
        if (failures > MAX_FAILURES) return {action: "end"};
        return {action: "retry", delay_ms: 1000 * Math.pow(2, failures - 1), failures: failures};
      }

      function show_session_ended() {
        if (document.getElementById("session-ended")) return;
        var box = document.createElement("div");
        box.id = "session-ended";
        box.setAttribute("role", "alertdialog");
        box.setAttribute("aria-labelledby", "session-ended-msg");
        box.style.cssText = "position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);" +
          "background:#1e1e1e;color:#fff;border:1px solid #888;border-radius:6px;padding:20px 28px;" +
          "font:16px sans-serif;text-align:center;z-index:10";
        var msg = document.createElement("p");
        msg.id = "session-ended-msg";
        msg.textContent = "Session ended";
        msg.style.cssText = "margin:0 0 14px;font-size:20px";
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Open a new terminal";
        btn.style.cssText = "font:inherit;padding:6px 14px;cursor:pointer";
        btn.onclick = function() { window.location.href = window.location.pathname.endsWith("/") ? "../new" : "new"; };
        box.appendChild(msg);
        box.appendChild(btn);
        document.body.appendChild(box);
        btn.focus();
      }

      var failures = 0;

      function make_reconnecting_terminal(ws_url) {
        var opened_at = null;
        var ended = false;
        ws = new WebSocket(ws_url);

        ws.onopen = function(event) {
          opened_at = Date.now();
          // Send initial size
          ws.send(JSON.stringify(['set_size', term.rows, term.cols]));

          data_disposable = term.onData((data) => {
            ws.send(JSON.stringify(['stdin', data]));
          });

          title_disposable = term.onTitleChange((title) => {
            document.title = title;
          });

          ws.onmessage = function(event) {
            var json_msg = JSON.parse(event.data);
            switch (json_msg[0]) {
              case "stdout":
                term.write(json_msg[1]);
                break;
              case "disconnect":
                ended = true;
                term.write("\r\n\r\n[Session was closed (maybe due to inactivity)]\r\n");
                break;
            }
          };
        };

        ws.onclose = function(event) {
          console.log('WebSocket closed');
          if (data_disposable) data_disposable.dispose();
          if (title_disposable) title_disposable.dispose();
          var d = reconnect_decision({
            opened: opened_at !== null,
            lived_ms: opened_at === null ? 0 : Date.now() - opened_at,
            ended: ended || (opened_at !== null && event.code === 1000),
            failures: failures
          });
          if (d.action === "retry") {
            failures = d.failures;
            setTimeout(function() { make_reconnecting_terminal(ws_url); }, d.delay_ms);
          } else {
            show_session_ended();
          }
        };
      }

      make_reconnecting_terminal(ws_url);

      window.onresize = function() {
        fitAddon.fit();
      };
    };
  </script>
</head>

<body>

</body>
